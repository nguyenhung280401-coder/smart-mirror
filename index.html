<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <title>Smart Mirror</title>

    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :root {
        --gold: #ffe36e;
        --white: #ffffff;
        --muted: #d0d9e8;
        --blue: #8fe7ff;
        --background: #000;
      }

      html,
      body {
        width: 100%;
        min-height: 100%;
      }
      body {
        min-height: 100vh;
        background: var(--background);
        color: var(--white);
        font-family: Arial, Helvetica, sans-serif;
        overflow: hidden;
      }

      .mirror {
        position: relative;
        width: 100%;
        min-height: 100vh;
        padding: 40px;
        background: #000;
      }

      /* GÓC TRÊN BÊN TRÁI: NGÀY & GIỜ */
      .datetime {
        position: absolute;
        top: 40px;
        left: 40px;
        width: min(42%, 460px);
        text-align: left;
        z-index: 2;
      }

      .date {
        color: var(--gold);
        font-size: clamp(16px, 1.5vw, 22px);
        font-weight: 700;
        letter-spacing: 1px;
        line-height: 1.45;
        text-shadow:
          0 0 10px rgba(255, 227, 110, 0.8),
          0 0 18px rgba(255, 196, 55, 0.45);
        text-transform: capitalize;
      }

      .clock {
        margin-top: 6px;
        color: var(--gold);
        font-size: clamp(45px, 5vw, 68px);
        font-weight: 300;
        letter-spacing: 2px;
        line-height: 1.08;
        font-variant-numeric: tabular-nums;
        text-shadow:
          0 0 9px rgba(255, 227, 110, 0.95),
          0 0 20px rgba(255, 196, 55, 0.72),
          0 0 38px rgba(255, 176, 35, 0.36);
      }

      .location {
        margin-top: 8px;
        color: var(--gold);
        font-size: clamp(12px, 1.1vw, 15px);
        font-weight: 700;
        letter-spacing: 1.8px;
        text-transform: uppercase;
        text-shadow:
          0 0 6px rgba(255, 227, 110, 0.95),
          0 0 15px rgba(255, 196, 55, 0.65);
      }

      /* Ô THÔNG BÁO / CẢNH BÁO THỜI TIẾT (Ở GIỮA PHÍA TRÊN) */
      .weather-alert {
        position: absolute;
        top: 40px;
        left: 50%;
        transform: translateX(-50%);
        width: min(50%, 600px);
        padding: 12px 20px;
        background: rgba(20, 20, 20, 0.85);
        border-radius: 8px;
        text-align: center;
        z-index: 10;
        box-shadow: 0 0 15px rgba(0, 0, 0, 0.8);
      }

      .alert-text {
        color: #ffcc00;
        font-size: clamp(14px, 1.3vw, 17px);
        font-weight: bold;
        letter-spacing: 0.5px;
        text-shadow: 0 0 8px rgba(255, 204, 0, 0.5);
      }

      /* THỜI TIẾT GÓC TRÊN BÊN PHẢI (ĐÃ PHÓNG TO HẾT CỠ THEO KHUNG YÊU CẦU) */
      .weather {
        position: absolute;
        top: 40px;
        right: 40px;
        width: clamp(340px, 36vw, 460px); /* Mở rộng khung chứa bên phải */
        margin: 0;
        padding: 0;
        border: 0;
        background: transparent;
      }

      .weather-heading {
        margin-bottom: 12px;
        color: var(--white);
        font-size: 15px; /* Phóng to tiêu đề */
        font-weight: 700;
        letter-spacing: 2.5px;
        text-align: right;
      }

      .weather-main {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 18px;
        margin-bottom: 15px;
        text-align: right;
      }

      .weather-icon {
        font-size: clamp(
          50px,
          4.5vw,
          65px
        ); /* Phóng to Icon thời tiết cực đại */
        filter: drop-shadow(0 0 10px rgba(210, 225, 255, 0.4));
      }

      .temperature {
        color: var(--white);
        font-size: clamp(
          50px,
          5vw,
          70px
        ); /* Phóng to nhiệt độ to bằng đồng hồ */
        font-weight: 300;
        line-height: 1;
        text-shadow:
          0 0 10px rgba(255, 255, 255, 0.95),
          0 0 22px rgba(143, 231, 255, 0.65);
      }

      .condition {
        margin-top: 6px;
        color: #e3e8ef;
        font-size: 17px; /* Phóng to chữ mô tả trạng thái */
        font-weight: 600;
      }

      .feels-like {
        margin-top: 4px;
        color: var(--muted);
        font-size: 14px; /* Phóng to cảm giác như */
      }

      .weather-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px 16px;
        margin-top: 10px;
      }

      .weather-card {
        min-width: 0;
        padding: 8px 0;
        text-align: right;
        border-bottom: 1px solid rgba(255, 255, 255, 0.15);
        background: transparent;
      }

      .card-icon {
        display: inline-block;
        margin-right: 6px;
        font-size: 14px;
      }

      .card-label {
        display: inline;
        color: var(--muted);
        font-size: 13px; /* Phóng to nhãn (ĐỘ ẨM, GIÓ...) */
        font-weight: 600;
        letter-spacing: 0.5px;
      }

      .card-value {
        margin-top: 4px;
        color: var(--white);
        font-size: clamp(
          18px,
          1.8vw,
          24px
        ); /* Phóng to số liệu độ ẩm, gió, mưa to rõ */
        font-weight: bold;
        font-variant-numeric: tabular-nums;
        text-shadow: 0 0 8px rgba(255, 255, 255, 0.85);
      }

      .updated {
        margin-top: 12px;
        color: #788494;
        font-size: 12px;
        text-align: right;
      }

      .error {
        margin-top: 8px;
        color: #ffaaaa;
        font-size: 12px;
        text-align: right;
      }

      .footer {
        position: absolute;
        right: 40px;
        bottom: 20px;
        color: rgba(169, 178, 192, 0.3);
        font-size: 11px;
        letter-spacing: 2px;
      }
    </style>
  </head>

  <body>
    <main class="mirror">
      <!-- CỤM NGÀY GIỜ BÊN TRÁI -->
      <section class="datetime">
        <div class="date" id="date">Đang tải ngày tháng...</div>
        <div class="clock" id="clock">--:--:--</div>
        <div class="location" id="location">BẢO LỘC · LÂM ĐỒNG</div>
      </section>

      <!-- Ô THÔNG BÁO / CẢNH BÁO THỜI TIẾT Ở GIỮA -->
      <div class="weather-alert" id="weatherAlertBox">
        <span class="alert-text" id="alertText"
          >Đang cập nhật tình hình thời tiết...</span
        >
      </div>

      <!-- CỤM THỜI TIẾT BÊN PHẢI (ĐÃ PHÓNG TO) -->
      <section class="weather">
        <h1 class="weather-heading">THỜI TIẾT HIỆN TẠI</h1>

        <div class="weather-main">
          <div class="weather-icon" id="weatherIcon">🌡️</div>
          <div>
            <div class="temperature" id="temperature">--°</div>
            <div class="condition" id="condition">Đang tải thời tiết...</div>
            <div class="feels-like">
              Cảm giác như <span id="feelsLike">--°C</span>
            </div>
          </div>
        </div>

        <div class="weather-grid">
          <div class="weather-card">
            <div class="card-icon">💧</div>
            <div class="card-label">ĐỘ ẨM</div>
            <div class="card-value" id="humidity">--%</div>
          </div>

          <div class="weather-card">
            <div class="card-icon">🌧️</div>
            <div class="card-label">KHẢ NĂNG MƯA</div>
            <div class="card-value" id="rain">--%</div>
          </div>

          <div class="weather-card">
            <div class="card-icon">💨</div>
            <div class="card-label">GIÓ</div>
            <div class="card-value" id="wind">-- km/h</div>
          </div>

          <div class="weather-card">
            <div class="card-icon">☁️</div>
            <div class="card-label">MÂY CHE PHỦ</div>
            <div class="card-value" id="cloud">--%</div>
          </div>
        </div>

        <div class="updated" id="updated">
          Đang kết nối dữ liệu thời tiết...
        </div>
        <div class="error" id="error" role="status"></div>
      </section>

      <footer class="footer">SMART MIRROR · LIVE WEATHER</footer>
    </main>

    <script>
      const TIMEZONE = "Asia/Ho_Chi_Minh";

      // Tọa độ chuẩn xác tại Trường THPT Nguyễn Du, Bảo Lộc, Lâm Đồng
      const LATITUDE = 11.5583;
      const LONGITUDE = 107.8091;

      // CẬP NHẬT ĐỒNG HỒ
      function updateClock() {
        const now = new Date();

        document.getElementById("clock").textContent = new Intl.DateTimeFormat(
          "vi-VN",
          {
            timeZone: TIMEZONE,
            hour: "2-digit",
            minute: "2-digit",
            second: "2-digit",
            hour12: false,
          },
        ).format(now);

        let dateText = new Intl.DateTimeFormat("vi-VN", {
          timeZone: TIMEZONE,
          weekday: "long",
          day: "numeric",
          month: "long",
          year: "numeric",
        }).format(now);

        dateText = dateText.charAt(0).toUpperCase() + dateText.slice(1);
        document.getElementById("date").textContent = dateText;
      }

      // XỬ LÝ MÃ THỜI TIẾT VÀ GÁN LỜI NHẮN THÔNG MINH
      function getWeatherInfo(code, isDay) {
        let info = { text: "Bình thường", icon: "🌡️" };
        let alertMsg = "Hôm nay trời đẹp, chúc bạn một ngày đầy năng lượng!";

        const isRainy =
          (code >= 51 && code <= 67) ||
          (code >= 80 && code <= 82) ||
          (code >= 95 && code <= 99);
        const isExtreme = code >= 95 && code <= 99;

        if (code === 0) {
          info = {
            text: isDay ? "Trời quang đãng" : "Trời quang",
            icon: isDay ? "☀️" : "🌙",
          };
          alertMsg = "Hôm nay trời đẹp, chúc bạn một ngày đầy năng lượng!";
        } else if (code === 1 || code === 2) {
          info = { text: "Có mây rải rác", icon: "⛅" };
          alertMsg = "Thời tiết mát mẻ";
        } else if (code === 3) {
          info = { text: "Nhiều mây", icon: "☁️" };
          alertMsg = "Trời nhiều mây";
        } else if ([45, 48].includes(code)) {
          info = { text: "Có sương mù", icon: "🌫️" };
          alertMsg =
            "Trời sương mù hạn chế tầm nhìn, chú ý khi ra đường bạn nhé!";
        } else if (isExtreme) {
          info = { text: "Có dông bão", icon: "⛈️" };
          alertMsg = "Tránh ra đường vào thời tiết này bạn nhé!";
        } else if (isRainy) {
          info = { text: "Đang có mưa", icon: "🌧️" };
          alertMsg = "Trời đang mưa bạn hãy mang ô hay áo mưa theo nhe!";
        }

        document.getElementById("alertText").textContent = alertMsg;
        return info;
      }

      // LẤY DỮ LIỆU THỜI TIẾT TỪ OPEN-METEO
      async function updateWeather() {
        const errorElement = document.getElementById("error");

        try {
          errorElement.textContent = "";

          const params = new URLSearchParams({
            latitude: String(LATITUDE),
            longitude: String(LONGITUDE),
            current:
              "temperature_2m,relative_humidity_2m,apparent_temperature,is_day,precipitation,weather_code,cloud_cover,wind_speed_10m",
            hourly: "precipitation_probability",
            forecast_days: "1",
            timezone: TIMEZONE,
          });

          const response = await fetch(
            "https://api.open-meteo.com/v1/forecast?" + params.toString(),
            { cache: "no-store" },
          );

          if (!response.ok) throw new Error("Lỗi kết nối máy chủ thời tiết");

          const data = await response.json();
          if (!data.current) throw new Error("Không có dữ liệu");

          const current = data.current;

          document.getElementById("temperature").textContent =
            Math.round(current.temperature_2m) + "°";
          document.getElementById("feelsLike").textContent =
            Math.round(current.apparent_temperature) + "°C";
          document.getElementById("humidity").textContent =
            current.relative_humidity_2m + "%";
          document.getElementById("wind").textContent =
            Math.round(current.wind_speed_10m) + " km/h";
          document.getElementById("cloud").textContent =
            current.cloud_cover + "%";

          const info = getWeatherInfo(
            current.weather_code,
            current.is_day === 1,
          );
          document.getElementById("condition").textContent = info.text;
          document.getElementById("weatherIcon").textContent = info.icon;

          const currentTime = current.time.slice(0, 13);
          const hourlyTimes = data.hourly?.time || [];
          const rainProbabilities =
            data.hourly?.precipitation_probability || [];
          const hourIndex = hourlyTimes.findIndex(
            (t) => t.slice(0, 13) === currentTime,
          );

          if (hourIndex >= 0 && rainProbabilities[hourIndex] != null) {
            document.getElementById("rain").textContent =
              rainProbabilities[hourIndex] + "%";
          } else {
            document.getElementById("rain").textContent = "0%";
          }

          const timeString = new Intl.DateTimeFormat("vi-VN", {
            timeZone: TIMEZONE,
            hour: "2-digit",
            minute: "2-digit",
            hour12: false,
          }).format(new Date());

          document.getElementById("updated").textContent =
            "Cập nhật lúc " + timeString;
        } catch (error) {
          console.error("Lỗi thời tiết:", error);
          errorElement.textContent =
            "Không tải được thời tiết. Kiểm tra lại mạng TV Box.";
          document.getElementById("updated").textContent =
            "Đang chờ kết nối...";
        }
      }

      updateClock();
      updateWeather();

      setInterval(updateClock, 1000);
      setInterval(updateWeather, 600000);
    </script>
  </body>
</html>
